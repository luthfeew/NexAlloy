name: Android Release CI

on:
  push:
    tags:
      - '*.*.*'

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Write key
      env:
        KEYSTORE_DATA: ${{ secrets.KEYSTORE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_DATA" ]; then
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" > signing.properties
          echo "KEYSTORE_ALIAS=$KEYSTORE_ALIAS" >> signing.properties
          echo "KEYSTORE_ALIAS_PASSWORD=$KEYSTORE_ALIAS_PASSWORD" >> signing.properties
          echo "KEYSTORE_FILE=../key.jks" >> signing.properties
          echo "$KEYSTORE_DATA" | base64 --decode > key.jks
        else
          echo "No KEYSTORE secret found. Skipping keystore configuration."
        fi

    - name: Build Release
      run: ./gradlew assembleRelease

    - run: |
        cd app/build/outputs/apk/release/
        if [ -f app-release.apk ]; then
          mv app-release.apk NexAlloy-${{ github.ref_name }}.apk
        elif [ -f app-release-unsigned.apk ]; then
          mv app-release-unsigned.apk NexAlloy-${{ github.ref_name }}.apk
        fi
        gh release create --prerelease ${{ github.ref_name }} NexAlloy-${{ github.ref_name }}.apk
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
